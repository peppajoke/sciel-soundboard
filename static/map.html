<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map sources · Soundboard</title>
<style>
  :root {
    --bg:#0e1014; --panel:#161a21; --panel2:#1d222b; --line:#2a313d;
    --text:#e6e9ef; --dim:#9099a8; --accent:#5aa9ff; --hot:#ff5a7a;
    --good:#4ad48a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); height:100vh;
         display:flex; flex-direction:column;
         font:14px/1.45 ui-sans-serif,system-ui,Segoe UI,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  a { color:var(--accent); text-decoration:none; }
  button { font:inherit; color:var(--text); background:var(--panel2);
           border:1px solid var(--line); border-radius:8px; padding:8px 12px;
           cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .on { background:var(--good); color:#06110b; border-color:var(--good);
        font-weight:600; }

  main { flex:1; display:grid; grid-template-columns:1fr 340px; gap:16px;
         padding:16px; min-height:0; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }

  .col { background:var(--panel); border:1px solid var(--line);
         border-radius:10px; display:flex; flex-direction:column; min-height:0; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
            color:var(--dim); margin:0; padding:12px 14px 8px; }
  .scroll { overflow:auto; padding:0 10px 10px; }

  .clip { display:flex; align-items:center; gap:10px; padding:9px 10px;
          border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .clip:hover { background:var(--panel2); }
  .clip.sel { background:var(--panel2); border-color:var(--accent); }
  .clip .nm { flex:1; overflow:hidden; text-overflow:ellipsis;
              white-space:nowrap; }
  .clip .cur { font-size:11px; color:var(--dim); }
  .clip .cur.none { color:var(--hot); }
  .clip .dur { font-size:11px; color:var(--dim); width:44px; text-align:right; }

  .src { display:flex; align-items:center; gap:10px; width:100%;
         margin-bottom:8px; text-align:left; }
  .src .key { display:inline-flex; align-items:center; justify-content:center;
              width:22px; height:22px; border-radius:5px; font-size:12px;
              background:var(--bg); border:1px solid var(--line);
              color:var(--dim); flex:none; }
  .src .n { margin-left:auto; font-size:11px; color:var(--dim); }
  .avatar { width:24px; height:24px; border-radius:50%; object-fit:cover;
            flex:none; display:inline-flex; align-items:center;
            justify-content:center; font-size:11px; font-weight:700;
            color:#0b0e13; }
  .hint { color:var(--dim); font-size:12px; padding:0 14px 12px; }
  #done { padding:20px; color:var(--dim); }
</style>
</head>
<body>

<header>
  <h1>Map sources</h1>
  <a href="/">&larr; board</a>
  <a href="/sources">edit sources</a>
  <button id="filterBtn" class="on">Unassigned only</button>
  <span id="count" style="color:var(--dim);font-size:12px"></span>
</header>

<main>
  <div class="col">
    <h2>Clips — click to select, <kbd>↑</kbd>/<kbd>↓</kbd> to move, <kbd>space</kbd> to hear</h2>
    <div class="scroll" id="clips"></div>
  </div>

  <div class="col">
    <h2>Assign to</h2>
    <div class="scroll" id="sources"></div>
    <div class="hint">Press <b>1</b>–<b>9</b> to assign and jump to the next
      clip. <b>0</b> clears the source. Nothing plays on stream — previews are
      local only.</div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const api = async (path, opts={}) => {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

let clips = [], sources = [], sel = 0, unassignedOnly = true, audio = null;

async function load() {
  const [c, s] = await Promise.all([
    api('/api/clips?state=all&sort=name'), api('/api/sources')]);
  sources = s.sources;
  clips = unassignedOnly ? c.clips.filter(x => !x.source) : c.clips;
  if (sel >= clips.length) sel = Math.max(0, clips.length - 1);
  $('#count').textContent = `${clips.length} shown · ${s.unassigned} unassigned`;
  renderSources();
  renderClips();
}

function renderClips() {
  const box = $('#clips');
  box.innerHTML = '';
  if (!clips.length) {
    box.innerHTML = '<div id="done">Nothing left to map. 🎉</div>';
    return;
  }
  clips.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'clip' + (i === sel ? ' sel' : '');
    const src = sources.find(s => s.id === c.source);
    el.innerHTML = `<span class="nm"></span>
      <span class="cur ${src ? '' : 'none'}">${src ? esc(src.name) : 'none'}</span>
      <span class="dur">${(c.play_duration ?? c.duration).toFixed(1)}s</span>`;
    el.querySelector('.nm').textContent = c.name;
    el.onclick = () => { sel = i; renderClips(); preview(); };
    box.appendChild(el);
  });
  // Keep the selected row visible while arrowing through a long list.
  box.children[sel]?.scrollIntoView({block: 'nearest'});
}

function makeAvatar(s) {
  if (s.image) {
    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = `/source_images/${s.image}`;
    return img;
  }
  const span = document.createElement('span');
  span.className = 'avatar';
  let h = 0;
  for (const ch of s.name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  span.style.background = `hsl(${h} 55% 62%)`;
  span.textContent = s.name.trim()[0].toUpperCase();
  return span;
}

function renderSources() {
  const box = $('#sources');
  box.innerHTML = '';
  sources.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'src';
    b.innerHTML = `<span class="key">${i < 9 ? i + 1 : '·'}</span>
                   <span class="slot"></span>
                   <span></span><span class="n">${s.clips}</span>`;
    b.querySelector('.slot').appendChild(makeAvatar(s));
    b.children[2].textContent = s.name;
    b.onclick = () => queueAssign(s.id);
    box.appendChild(b);
  });
  const clear = document.createElement('button');
  clear.className = 'src';
  clear.innerHTML = `<span class="key">0</span><span>— none —</span>`;
  clear.onclick = () => queueAssign(null);
  box.appendChild(clear);
}

// Preview is a plain <audio> on the clip file: local to this browser, never
// routed to the soundboard outputs, so mapping cannot fire anything on stream.
function preview() {
  const c = clips[sel];
  if (!c) return;
  if (audio) audio.pause();
  audio = new Audio(`/api/clips/${c.id}/audio`);
  audio.currentTime = c.start || 0;
  const end = c.end == null ? null : c.end;
  audio.ontimeupdate = () => { if (end != null && audio.currentTime >= end) audio.pause(); };
  audio.play().catch(() => {});
}

async function assign(sourceId) {
  const c = clips[sel];
  if (!c) return;
  await api(`/api/clips/${c.id}`, {method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({source: sourceId})});

  if (unassignedOnly && sourceId) {
    // The row leaves the list, so the next clip slides into this index --
    // holding `sel` still is what makes rapid-fire mapping work.
    clips.splice(sel, 1);
    if (sel >= clips.length) sel = Math.max(0, clips.length - 1);
    const s = sources.find(x => x.id === sourceId);
    if (s) s.clips++;
    $('#count').textContent = `${clips.length} shown`;
    renderSources();
    renderClips();
  } else {
    c.source = sourceId;
    if (sel < clips.length - 1) sel++;
    await load();
  }
}

// assign() reads clips[sel] up front but only moves the list on AFTER its PATCH
// comes back, and every caller fires it without awaiting. Two quick presses --
// which is the entire point of this screen -- therefore both read the SAME
// clip: it got assigned twice and the clip behind it was spliced out of the
// list still unassigned, silently skipped. Chain the calls so each one starts
// only once the previous has finished moving the list.
let assignChain = Promise.resolve();
const queueAssign = id => {
  // The resync is part of "finished moving the list", so it has to be awaited
  // too: assign() reads clips[sel] up front, and letting the next link start
  // while load() is still in flight leaves it splicing an array load() is
  // about to throw away -- the same wrong-clip bug this chain exists to stop.
  // load()'s own failure is swallowed separately, so a resync that fails still
  // cannot poison the chain and kill every later keypress.
  assignChain = assignChain.then(() => assign(id))
                           .catch(() => load().catch(() => {}));
};

$('#filterBtn').onclick = () => {
  unassignedOnly = !unassignedOnly;
  $('#filterBtn').classList.toggle('on', unassignedOnly);
  $('#filterBtn').textContent = unassignedOnly ? 'Unassigned only' : 'All clips';
  sel = 0;
  load();
};

document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key >= '1' && e.key <= '9') {
    const s = sources[+e.key - 1];
    if (s) { e.preventDefault(); queueAssign(s.id); }
  } else if (e.key === '0') {
    e.preventDefault(); queueAssign(null);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (sel < clips.length - 1) { sel++; renderClips(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (sel > 0) { sel--; renderClips(); }
  } else if (e.code === 'Space') {
    e.preventDefault(); preview();
  }
});

load();
</script>
</body>
</html>
