<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sources · Soundboard</title>
<style>
  :root {
    --bg:#0e1014; --panel:#161a21; --panel2:#1d222b; --line:#2a313d;
    --text:#e6e9ef; --dim:#9099a8; --accent:#5aa9ff; --hot:#ff5a7a;
    --good:#4ad48a;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 ui-sans-serif,system-ui,Segoe UI,sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  a { color:var(--accent); text-decoration:none; }
  button { font:inherit; color:var(--text); background:var(--panel2);
           border:1px solid var(--line); border-radius:8px; padding:8px 12px;
           cursor:pointer; }
  button:hover { border-color:var(--accent); }
  .danger:hover { border-color:var(--hot); color:var(--hot); }
  main { max-width:640px; margin:0 auto; padding:20px 16px; }
  input[type=text] { padding:9px 11px; border-radius:8px; font:inherit;
    border:1px solid var(--line); background:var(--panel2); color:var(--text); }
  .row { display:flex; gap:8px; align-items:center; }
  #add { margin-bottom:18px; }
  #add input { flex:1; }
  .src { display:flex; gap:10px; align-items:center; padding:11px 12px;
         background:var(--panel); border:1px solid var(--line);
         border-radius:10px; margin-bottom:8px; }
  .src .nm { flex:1; font-weight:600; }
  .src .cnt { color:var(--dim); font-size:12px; }
  .src input { flex:1; }
  .note { color:var(--dim); font-size:12px; margin-top:16px; }
</style>
</head>
<body>

<header>
  <h1>Sources</h1>
  <a href="/">&larr; back to the board</a>
</header>

<main>
  <div class="row" id="add">
    <input id="name" type="text" placeholder="New source — e.g. Nathan Fielder" autofocus>
    <button id="addBtn">Add</button>
  </div>

  <div id="list"></div>

  <p class="note" id="unassigned"></p>
  <p class="note">Deleting a source never deletes clips — they just become
    unassigned, and you can put them somewhere else.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const api = async (path, opts={}) => {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
};

async function load() {
  const d = await api('/api/sources');
  const list = $('#list');
  list.innerHTML = '';
  if (!d.sources.length) list.innerHTML = '<p style="color:var(--dim)">No sources yet.</p>';

  for (const s of d.sources) {
    const el = document.createElement('div');
    el.className = 'src';
    el.innerHTML = `<span class="nm"></span>
      <span class="cnt">${s.clips} clip${s.clips === 1 ? '' : 's'}</span>
      <button class="ren">Rename</button>
      <button class="del danger">Delete</button>`;
    el.querySelector('.nm').textContent = s.name;

    el.querySelector('.ren').onclick = () => {
      const input = document.createElement('input');
      input.type = 'text'; input.value = s.name;
      el.replaceChild(input, el.querySelector('.nm'));
      input.focus();
      const commit = async () => {
        if (input.value.trim() && input.value !== s.name) {
          await api(`/api/sources/${s.id}`, {method:'PATCH',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({name: input.value})});
        }
        load();
      };
      input.onblur = commit;
      input.onkeydown = e => { if (e.key === 'Enter') input.blur();
                               if (e.key === 'Escape') load(); };
    };

    el.querySelector('.del').onclick = async () => {
      const warn = s.clips
        ? `Delete "${s.name}"? ${s.clips} clip(s) will become unassigned. The clips are kept.`
        : `Delete "${s.name}"?`;
      if (!confirm(warn)) return;
      await api(`/api/sources/${s.id}`, {method:'DELETE'});
      load();
    };
    list.appendChild(el);
  }
  $('#unassigned').textContent = d.unassigned
    ? `${d.unassigned} clip(s) have no source yet.` : '';
}

async function add() {
  const name = $('#name').value.trim();
  if (!name) return;
  try {
    await api('/api/sources', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name})});
    $('#name').value = '';
    load();
  } catch (e) { alert('Could not add: ' + e.message); }
}
$('#addBtn').onclick = add;
$('#name').onkeydown = e => { if (e.key === 'Enter') add(); };

load();
</script>
</body>
</html>
